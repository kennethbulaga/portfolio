<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Minimal 640px Hairline List (Pure Marwie Clone)</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&family=Newsreader:ital,opsz,wght@1,6..72,400&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 1440px; height: 900px; overflow: hidden; background: #fcfcfb; color: #111113; font-family: 'Figtree', sans-serif; display: flex; padding: 12px; }
  .sidebar { width: 260px; height: 876px; border-radius: 26px; padding: 5px; background: #f0f0ed; border: 1px solid #e2e2de; }
  .panel { height: 100%; border-radius: 21px; background: #fff; padding: 16px; border: 1px solid #e6e6e2; }
  .main { flex: 1; display: flex; justify-content: center; padding-top: 96px; }
  .col { width: 640px; display: flex; flex-direction: column; gap: 56px; }
  .row { display: flex; align-items: center; gap: 16px; padding: 14px 0; border-top: 1px solid #ebebea; }
  .thumb { width: 72px; height: 48px; border-radius: 8px; background: #ededec; }
</style>
</head>
<body>
  <aside class="sidebar"><div class="panel"><div style="font-weight:600;font-size:18px;">Kenneth Bulaga</div></div></aside>
  <main class="main">
    <div class="col">
      <div>
        <h1 style="font-size:34px;font-weight:500;line-height:1.25;">Full-stack developer building <span style="font-family:'Newsreader',serif;font-style:italic;">dependable</span> software.</h1>
        <p style="font-size:17px;color:#4a4a4f;margin-top:16px;line-height:1.65;">Single 640px column with compact 72×48 row thumbnails.</p>
      </div>
      <div>
        <div style="font-size:14px;color:#6e6e73;margin-bottom:12px;">Projects · 04</div>
        <div class="row"><div class="thumb"></div><div><div style="font-weight:500;">JP Connect</div><div style="font-size:14px;color:#6e6e73;">Student Services Portal</div></div></div>
        <div class="row"><div class="thumb"></div><div><div style="font-weight:500;">OWWA CSMR</div><div style="font-size:14px;color:#6e6e73;">Citizen Feedback Tool</div></div></div>
      </div>
    </div>
  </main>
</body>
</html>
